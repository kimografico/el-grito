collaborations:
  title: "Colaboraciones con El Grito"
  description: |
    Uno de los ejes principales del proyecto El Grito es contrastar la información científica por medio de entrevistas a especialistas en diversas ramas de la ciencia, representantes comunitarios, artistas, personas que necesiten lanzar un grito desde su espacio, un grito que aporte a transparentar esta realidad.

    La finalidad de estas entrevistas es el reporte y la testificación de hechos controversiales como: la deforestación, los deshielos de los glaciales, incendios forestales, tráfico ilegal de fauna silvestre, pesca ilegal, contaminación, etc.
  specialtiesTitle: "Especialidades:"
  specialties:
    - "Ciencias de la Atmósfera"
    - "Meteorología"
    - "Oceanografía"
    - "Glaciología"
    - "Geología"
    - "Biología"
    - "Industria Agropecuaria"
    - "Contaminación: Emisiones de Carbono"
    - "Salud del planeta"
    - "Educación cultura y sociedad (Filósofos, Antropólogos)"
    - "Energía limpia"
    - "Acciones ciudadanas y mundiales (Acuerdos, etc)"
    - "Sostenibilidad"
    - "Entre otras."
  callToAction: "Hacemos un llamamiento a todos los especialistas interesados en este macro proyecto."
  participationText: |
    Nos gustaría visitarte para hacerte una entrevista directamente a nuestro estilo, pero si no se puede, por motivos de distancia, te daríamos todas las pautas para que te la hagas en condiciones.

    También puedes participar dejándonos material: Archivo audiovisual, imágenes que podamos compartir, videos de archivo o documentación de investigaciones que puedan aportar a nuestras temáticas.

    De nuestra parte como proyecto EL GRITO – BIOTOX nos comprometemos para apoyarte con publicidad en todas nuestras plataformas y redes sociales para que te des a conocer.

    Adicionalmente, los científicos y especialistas interesados en colaborar en nuestro proyecto formarán parte de la difusión de sus testimonios en los capítulos que correspondan a sus temáticas y especialidades.
  scientistsTitle: "Científicos que ya colaboran con El Grito"
