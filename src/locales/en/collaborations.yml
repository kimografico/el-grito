collaborations:
  title: "Collaborations with El Grito"
  description: |
    One of the main axes of the El Grito project is to contrast scientific information through interviews with specialists in various branches of science, community representatives, artists, people who need to scream from their space, a scream that contributes to making this reality transparent.

    The purpose of these interviews is the reporting and testimony of controversial facts such as: deforestation, glacier melting, forest fires, illegal wildlife trafficking, illegal fishing, pollution, etc.
  specialtiesTitle: "Specialties:"
  specialties:
    - "Atmospheric Sciences"
    - "Meteorology"
    - "Oceanography"
    - "Glaciology"
    - "Geology"
    - "Biology"
    - "Agricultural Industry"
    - "Pollution: Carbon Emissions"
