    - "Education, Culture, and Society (Philosophers, Anthropologists)"
    - "Clean Energy"
    - "Citizen and Global Actions (Agreements, etc.)"
    - "Sustainability"
    - "Among others."
  callToAction: "We make a call to all specialists interested in this macro project."
  participationText: |
    We would like to visit you to conduct an interview directly in our style, but if it is not possible due to distance, we would give you all the guidelines so you can do it under proper conditions.

    You can also participate by leaving us material: audiovisual files, images we can share, archive videos, or research documentation that can contribute to our topics.

    On our part as the EL GRITO – BIOTOX project, we commit to supporting you with advertising on all our platforms and social media so you can make yourself known.

    Additionally, scientists and specialists interested in collaborating in our project will be part of the dissemination of their testimonies in the chapters corresponding to their topics and specialties.
  scientistsTitle: "Scientists already collaborating with El Grito"
