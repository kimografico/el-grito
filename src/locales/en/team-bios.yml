teamBios:
  lidia-aparicio:
    role: "Director – Screenwriter"
    bio: |
      Professional training in image and sound with a broad complementarity of training in the visual field at the University of Valencia, as a camera operator and image and sound.

      Self-taught screenwriting student and numerous courses in digital photography, special effects, marketing among others, to stay up to date with new technologies and trends in the social media environment in architecture, industrial, documentary, gastronomic and creative fields.

      More than 10 years working in different companies, such as qubo3, BNI Valencia, Gsoft innova marketing estratégico. As a creative, documentary, industrial and advertising photographer. Creating personalized images.

      Within her client portfolio, she has made documentaries for La Ford, El Corte Inglés, Icemi, Westin, Oscar Torrijos, Milestone, Panamar, Marina Beach, Hotel Holiday among many diverse companies.

      She has collaborated with associations such as Agfoval and is currently part of the Amseld Association team. Creating different solidarity creative projects, such as the exhibition "El alma de las mujeres Luna" awarded with Foto Europa 2001 culture/entrepreneurship section.

      She has published in press and magazines in documentary journalistic, gastronomic and editorial photography. From Spain to Los Angeles (California).

      She has traveled to Mexico Guadalajara, Toronto and Los Angeles as a photographer and director of photography. One of the most notable experiences was being invited to the filming of the movie Pacific Rim directed by Guillermo del Toro, and then conducting interviews with some of her colleagues who have been part of her life.
  fernanda-gallardo:
    role: "Executive Producer on Location"
    bio: |
      Naturalist photographer, science communicator, audiovisual producer and communication and science project manager with 11 years of experience.

      In Ecuador, I worked as a graphic journalist from 2010 to 2015 in public institutions and as a trainer in professionalization workshops for photographers and cameramen throughout Ecuador. In private spaces, I taught digital photography workshops at the Centro de la Imagen Arte y Fotografía for three years.

      In Spain, in the city of Seville, during 2017 and 2018, I worked for the "Solidarios para el Desarrollo" Foundation teaching the first Community Social Photography Workshop for foundation users, for homeless people, and at the same time I was part of the MUJEREANDO Theater Company team, women also homeless who use theater as therapy, where I created photographic portfolios and journalistic articles for Spain and Ecuador.

      In 2019, in the city of Valencia, I worked for the Ajuntament de Valencia as a photographic guide, in a project called Click Al'Horta.

      The idea was to tour each orchard and boost the interest that its heritage has towards the Valencian community, and in parallel, I collaborated as a photographic assistant for the VALIENTES PHOTON project and the "Adonar Foundation" in workshops for young people in migrant care conditions, where photography was used as a tool for social change.

      Currently in Ecuador, I work independently as a trainer in various spaces, audiovisual producer at KUNA, the "Community of Science and Ancestral Knowledge Communicators of Ecuador" and environmental communicator at Fondo Animal, an organization that supports urban and wildlife rescue centers in Ecuador.
  amseld-belen:
    role: "Belén Motilla Ginés • Executive Co-producer"
    bio: |
      The Association of Solidarity and Entrepreneurial Women and Men L.D. has been carrying out various actions within the Purposes and Acts registered in our Statutes for more than 15 years, and over the years, we have evolved and new projects have been added.

      Carry out actions such as events, campaigns, marketing, etc., for those non-profit associations that need our time and put it at their service in order to achieve the desired objectives. For this, the only requirement we request is that all the money raised with our work is donated for charitable purposes.

      Our association also serves as a link between companies and official bodies. The only thing we request is that if we raise funds, a percentage will be donated to our entity to continue working on our social work.

      We organize meetings between entrepreneurs, companies and organizations for Networking.

      We walk hand in hand with people who come to ask us for help to start a business, giving them all the necessary tools so they can develop their project.

      We get involved and participate in topics as diverse and important as: Environment, Sustainability, Ecology, Social Inclusion, Women, LGBTI, Children, Functional Diversity, Disability, Geriatrics, Fashion, Migration, Animal Rights, Event Organization and Awareness Actions.
artistBios:
  kimo-saez:
    role: "Graphic Designer"
    bio: |
      Graphic designer based in Valencia with more than 20 years of experience. He has never stopped training, continuously expanding his skills in areas such as illustration and packaging.

      His main field of work is web design and development, where he combines his creative side with the technical part to create complete digital experiences. He also dominates corporate identity, commercial stationery, signage and editorial design.

      He has collaborated with clients such as Decathlon, Leroy Merlin, Generalitat Valenciana, Turismo de Montanejos, writers and various artists. In recent times, he has incorporated artificial intelligence as a key tool in his workflow, enhancing his creative capacity and efficiency.

      In the El Grito project, Kimográfico contributes its creative sensitivity to give visual shape to the documentary's identity, translating its environmental awareness values into a graphic language that connects with the public.

      More information at kimografico.com
  isaias-escudero:
    role: "Illustrator"
    bio: |
      Graduate from the Faculty of Fine Arts of San Carlos at UPV (Valencia), specializing in photography and painting. He has lived in Ireland (Dublin, 2007), Greece (Thessaloniki, 2001), China (Beijing, 2008) and France (Toulouse, 2010). Focused on photography, painting and illustration, and markedly multidisciplinary in character, he combines traditional and digital media.

      In photography, he has worked assisting in the preparation and editing of the French national rugby team's charity calendar (2001), as well as in various advertising campaigns. He has also worked on matte painting in environmental integration projects (EDIGMA INGENIERÍA).

      He has created illustrations for various media and publications ("Bostezo"), fanzines and comics. Layout, design and illustration for several CDs ("DUNA: terra", "Elma Sambeat: MUERTO DE AMOR", "MEDITERRANEAN ROOTS", "Vuelo de Mar") and has collaborated as a set design, props and lighting designer in different theater works ("STRINDBERG. LA MÁS FUERTE").

      He has also collaborated on television projects such as "HISTORIETES MEDIEVALES" for "A Punt" (Valencia), making props and set pieces. For Alaquàs (Valencia), he created a pair of giants, modeling the heads in clay and transferring them to fiberglass.

      He has taught workshops in schools and institutes on comics, children's book illustration and graffiti.
  jose-vazquez:
    role: "Music Productions"
    bio: |
      Trainer and musician by nature, he has been teaching courses and talks on environmental awareness, food hygiene and occupational risk prevention for more than 15 years. An inexhaustible fight that has always tried to address by shaking consciences and expanding the audience's global vision.

      As a musician, he has dedicated himself to performance, arrangement and composition for numerous projects (Sujeto K, La Golfería and other formations) as well as for jingles and soundtracks.

      Now, he does not want to miss the opportunity to unite his two passions in this project, enhancing the impact of the discourse with his composition.
