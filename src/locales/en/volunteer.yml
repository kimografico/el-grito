volunteer:
  title: "Volunteering Plan"
  heroImage: "http://elgritodelanaturaleza.com/wp-content/uploads/2021/08/pexels-photo-3014826-scaled.jpg"
  description: |
    The EL GRITO documentary project promotes volunteering from a collaborative vision. In collaboration with the Amseld Association, we are committed to giving volunteers the opportunity to develop their abilities and get involved in various topics, through their daily work in our areas of operation.

    EL GRITO seeks committed people who identify with its mission and values to support with their skills and energy in the implementation of its projects.
  missionTitle: "Mission"
  mission: "Support and follow up on strategic initiatives, special marketing projects, and the management of administrative processes."
  howToParticipateTitle: "How can I be part of the EL GRITO Volunteering Program?"
  howToParticipate: "To be part of the EL GRITO volunteers group, all you have to do is:"
  requirementsTitle: "Requirements"
  requirementsSubtitle: "We are looking for volunteers with:"
  requirements:
    - "Commitment, proactivity, and teamwork skills"
    - "Interpersonal, organizational, and information gathering skills"
    - "Minimum age 22 years"
    - "Interest in Administration and Marketing topics"
    - "Seriousness in complying with schedules and assigned tasks"
    - "Being communicative"
    - "Responsibility, compliance, and dedication"
  areasTitle: "Thematic areas"
  areasSubtitle: "Areas that are part of the Volunteering Program:"
  areas:
    - "Administration and management"
    - "Digital Communication"
    - "Digital marketing"
    - "Social Media Management"
    - "Support and assistance in various activities"
  functionsTitle: "Functions"
  functions:
    - "Monitor EL GRITO's different social media channels."
    - "Support in the tactical management of the different marketing plans planned in the area."
    - "Support in the implementation of the communication strategy for the different campaigns on the website."
    - "Support in the development of special projects in the area."
    - "Carry out other activities inherent to the position assigned by their immediate supervisor."
  materialsTitle: "Materials the volunteer needs to bring"
  materials: "The selected volunteer must have their own personal computer for the development of volunteering activities."
  benefitsTitle: "What are the benefits of the Volunteering Program?"
  benefitsSubtitle: "By doing your volunteering at EL GRITO, the Association offers you:"
  benefits:
    - "Work experience related to Administration, Management, Communication, and Marketing"
    - "Knowledge about the creation of a documentary project"
    - "Strengthening of skills and abilities"
    - "Networking with relevant actors and experts"
    - "Tutor support"
    - "Schedule flexibility"
    - "Excellent work environment"
    - "Participation in activities related to your work area (trips, events, etc.)"
    - "Certificate at the end of the volunteering"
  contactTitle: "How to contact us?"
  contactText: "If you are interested in being part of our volunteer team, write to us!"
  note: "The designation as a volunteer does not entail an employment or professional services relationship with EL GRITO, nor does it entitle remuneration or economic recognition of any kind. Volunteering does not cover medical insurance."
