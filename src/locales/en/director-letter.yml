directorLetter:
  title: "DIRECTOR'S LETTER"
  location: "Valencia, May 29, 2021"
  quote: "\"I felt a scream that crossed nature\""
  quoteText: "I felt a scream that crossed nature"
  content: |
    After years of warnings, it seems imminent that the warming of the climate system is undeniable, as evidenced by the increase in global average air and ocean temperatures, the widespread melting of snow and ice, which results in the global average rise in sea level.

    The earth, as if it were a living organism, changes. These natural cycles are long, but no one questions anymore that a very important change in these cycles is occurring since the end of the 19th century, dramatically accelerated since the mid-20th century, all of it due to human activities without any doubt.

    This has caused the timing of the next change to accelerate with unknown consequences, which demands an urgent solution to the causes that provoke it.

    Inevitably, we must refer to the current economic system, since it seems to be a very important actor in the causes. Considering that the priority objective of this system is to make money, it is easy to understand that other issues are left on the back burner, which seems to lead to massive and predatory exploitation of the planet, not taking into account the consequences.

    What seemed like something apocalyptic from a science fiction novel seems to be arriving: the poles are melting, climate alteration is evident, the scientific community seems to have reached a consensus that makes us see that measures are of an urgent nature, we are reaching the point of no return, ignoring the system—something so obvious as that without nature we would not exist.

    The El Grito project was born from all these real problems, which since I was a child made me ache inside. I remember those days when we sat in front of the television completely excited, waiting to see those wonderful documentaries of the mythical figure that was Félix Rodríguez de la Fuente, a Spanish naturalist and environmentalist broadcaster, defender of nature.

    Highlighting one of his great projects, "El hombre y la tierra" (Man and the Earth). It contributed greatly to ecological awareness in Spain at a time when the country still had no ecological awareness or nature defense movements.

    Documentaries that made us understand that nature is scarce, that it takes care of us like a mother, and without it we are incapable of existing.

    That was one of the principles from which I inspired myself to develop the El Grito project. The difference is that the way of narrating it would be somewhat different.

    In this case, I intended to reach a contrasted and real message, but using fantasy or fiction to tell it in a completely different and accessible way for all those sensibilities that only need to be stimulated and are essential to create a better world.

    Fantasy, if well used as a symbol, is a means to express in abstract things that in a direct way we could not express in the same way. And if fantasy is a symbol of real aspects, even if abstract, it can be a vehicle to facilitate the understanding of something that is not so direct and is not seen so clearly with the eyes, greatly expanding the vision of things.

    We are troubled by the destruction of that outer world that constitutes our vital framework. However, there is another form of destruction that is not talked about, which is equally tragic: that of our inner world.

    When everything is subordinated to profit, people begin to be exploited and finally the environment.

    El Grito conducts research where we can understand why we are polluting the environment and what the options would be to remedy it. Investigating together with scientists the most current problems we are suffering from environmental problems caused by us humans.

    All this valuable information will be represented through creatives from different disciplines who will create photographic sessions with conceptual characters of fiction or fantasy loaded with symbologies that will show the different situations in a free, unique, and above all inspiring way.

    Perhaps helping to awaken the talent of sleeping minds.
  author: "Lidia Aparicio (Spain)"
  authorRole: "Director"
  signature: "/images/decorative/lidia-firma.jpg"
